<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Escape SA | Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>ADVENTURE ESCAPE SA</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="fees.html">Fees</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <section class="section">
      <h2>CONTACT US</h2>

      <p>
        Have a question or need help with a booking? Send us a message.
      </p>

      <form>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">

        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Type your message"></textarea>

        <button type="submit">SEND MESSAGE</button>

      </form>

      <div class="featured">
        <h3>ADVENTURE ESCAPE SA</h3>

        <p>Western Cape, South Africa</p>
        <p>Adventure enquiries and bookings welcome.</p>
      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 Adventure Escape SA</p>
  </footer>

</body>
</html>
